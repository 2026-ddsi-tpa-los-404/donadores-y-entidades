# H2 in-memory database for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# URLs de servicios externos (dummy para tests: no se hacen llamadas reales)
services.donaciones.url=http://localhost:1
services.logistica.url=http://localhost:1
incentivos.url=http://localhost:1

# Logging centralizado desactivado en tests (sin API key => solo consola)
management.datadog.metrics.export.enabled=false
management.datadog.metrics.export.api-key=
